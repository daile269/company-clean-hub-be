# ===== HIKARI CONNECTION POOL=====
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.keepalive-time=300000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000

# ===== CCCD VALIDATION =====
cccd.validation.max-file-size-mb=10
cccd.validation.allowed-mime-types=image/jpeg,image/png,image/webp

# Chất lượng ảnh
cccd.validation.min-width=300
cccd.validation.min-height=200
cccd.validation.blur-threshold=35.0
cccd.validation.min-brightness=40
cccd.validation.max-brightness=230
cccd.validation.min-contrast=30

# Nhận diện thẻ
cccd.validation.card.min-area-ratio=0.15
cccd.validation.card.aspect-ratio-min=1.1
cccd.validation.card.aspect-ratio-max=2.1
cccd.validation.card.aspect-ratio-tolerance=0.20

# Scoring thresholds
cccd.validation.score.accept=80
cccd.validation.score.review=65

# Tr\u1ecdng s\u1ed1 t\u1eebng b\u01b0\u1edbc (t\u1ed5ng = 100)
cccd.validation.score.weight.quality=20
cccd.validation.score.weight.card-detection=20
cccd.validation.score.weight.aspect-ratio=10
cccd.validation.score.weight.completeness=10
cccd.validation.score.weight.template-match=25
cccd.validation.score.weight.required-regions=15

# Template
cccd.validation.template.base-path=classpath:static/cccd-templates
cccd.validation.template.front-v1=front/cccd_front_v1.png
cccd.validation.template.back-v1=back/cccd_back_v1.png
cccd.validation.template.match-threshold=0.65

# OpenAI GPT Vision CCCD Extraction Configuration
openai.api.url=${OPENAI_API_URL:https://api.openai.com/v1/responses}
openai.api.key=${OPENAI_API_KEY:}
openai.api.model=${OPENAI_MODEL:gpt-5.4-mini}
openai.api.enabled=${OPENAI_API_ENABLED:true}
openai.api.timeout-seconds=30
